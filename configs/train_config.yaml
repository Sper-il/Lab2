# Cau hinh training M3 (mac dinh anh 64 chay nhanh tren GPU Colab T4 + AMP).
# Muon chay pipeline demo M1 chuan ImageNet 224 thi ghi de --image-size 224 khi chay.
train:
  model: resnet18
  strategy: fine_tune
  freeze_until: 1
  freeze_head_full: false
  weights: DEFAULT
  num_classes: 10
  epochs: 5
  batch_size: 32
  num_workers: 2
  lr: 0.001
  optimizer: adam
  use_amp: true
  weight_decay: 0.0001
  momentum: 0.9
  scheduler: none
  loss: cross_entropy
  label_smoothing: 0.0
  seed: 42
  device: auto
  image_size: 64
  early_stopping_patience: 0
  log_images: true
  log_histograms: true
  log_graph: false

tensorboard:
  enabled: true
  log_dir: results/runs
  log_images: true
  log_histograms: true
  log_graph: false
