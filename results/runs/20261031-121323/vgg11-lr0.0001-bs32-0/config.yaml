train:
  model: vgg11
  strategy: fine_tune
  freeze_until: 1
  freeze_head_full: false
  weights: DEFAULT
  num_classes: 10
  epochs: 20
  batch_size: 32
  lr: 0.0001
  optimizer: adam
  weight_decay: 0.0001
  momentum: 0.9
  scheduler: none
  loss: cross_entropy
  label_smoothing: 0.0
  num_workers: 2
  seed: 42
  device: auto
  image_size: 64
  use_amp: true
  early_stopping_patience: 0
  log_images: true
  log_histograms: true
  log_graph: false
tensorboard:
  enabled: true
  log_dir: results/runs
  log_images: true
  log_histograms: true
  log_graph: false
